services:
  - type: web
    name: mercadolibre-sistema
    env: node
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: AUTO_REPLY_MODE
        value: supervised
      - key: POLLING_INTERVAL_MINUTES
        value: 2
      - key: ACCOUNT1_APP_ID
        sync: false
      - key: ACCOUNT1_SECRET_KEY
        sync: false
      - key: ACCOUNT2_APP_ID
        sync: false
      - key: ACCOUNT2_SECRET_KEY
        sync: false
